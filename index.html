<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CSV Report Generator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Roboto', sans-serif; }
    .fade-in {
      animation: fadeIn 1s ease-out;
      opacity: 0;
      animation-fill-mode: forwards;
    }
    @keyframes fadeIn {
      to { opacity: 1; transform: translateY(0); }
      from { opacity: 0; transform: translateY(20px); }
    }
    ::selection { background: #22c55e; color: black; }
  </style>
</head>
<body class="bg-black text-white min-h-screen flex items-center justify-center p-4">

  <div class="bg-gray-900 border border-green-500 rounded-3xl shadow-xl p-8 w-full max-w-xl fade-in">
    <h1 class="text-3xl md:text-4xl font-bold text-green-400 mb-6 text-center">
      📊 CSV Report Generator
    </h1>

    <form method="POST" enctype="multipart/form-data" class="space-y-6">
      <input type="file" name="file" accept=".csv" required
             class="w-full bg-gray-800 text-white border border-green-500 rounded-lg px-4 py-3 text-base focus:outline-none focus:ring-2 focus:ring-green-400" />

      <button type="submit"
              class="w-full bg-green-500 hover:bg-green-400 text-black font-bold py-3 rounded-lg shadow-md transition duration-200">
        📈 Analyze & Generate Report
      </button>
    </form>

  </div>

</body>
</html>
